<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlexHunter Autofill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 380px; background: #ffffff; color: #1e293b; padding: 14px; font-size: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; color: #0f172a; }
    .brand-logo { width: 22px; height: 22px; background: #2563eb; color: #ffffff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .job-title { font-size: 13px; font-weight: 800; color: #0f172a; line-height: 1.3; }
    .job-company { font-size: 11px; color: #64748b; margin-top: 2px; }

    .fit-box { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; margin-bottom: 10px; }
    .fit-score { font-size: 18px; font-weight: 900; color: #047857; }
    .fit-desc { font-size: 11px; color: #065f46; font-weight: 600; line-height: 1.2; }

    .field-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 11px; }
    .field-row:last-child { border-bottom: none; }
    .field-label { color: #64748b; font-weight: 600; }
    .field-value { font-weight: 700; color: #0f172a; }

    .pitch-textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 11px; line-height: 1.4; color: #334155; margin-top: 6px; resize: none; background: #ffffff; }

    .btn-primary { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; margin-top: 10px; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { width: 100%; background: #ffffff; color: #334155; border: 1px solid #cbd5e1; padding: 8px; border-radius: 10px; font-weight: 700; font-size: 11px; cursor: pointer; margin-top: 6px; text-align: center; }
    .btn-secondary:hover { background: #f8fafc; }

    .status-msg { margin-top: 8px; font-size: 10px; text-align: center; color: #059669; font-weight: 700; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-logo">F</div>
      <span>FlexHunter</span>
    </div>
    <span class="badge">15h / wk Cap</span>
  </div>

  <!-- Job Detected Card -->
  <div class="card">
    <div class="card-title">
      <span>Detected Role</span>
      <span style="color: #2563eb;">Live Tab</span>
    </div>
    <div class="job-title" id="jobTitle">Detecting job from page...</div>
    <div class="job-company" id="jobCompany">Open any job application page</div>
  </div>

  <!-- Compatibility -->
  <div class="fit-box">
    <div class="fit-score" id="fitScore">88%</div>
    <div class="fit-desc">
      <div>Strong Student Fit</div>
      <div style="font-weight: 400; font-size: 10px; color: #047857;">Afternoon bandwidth fits schedule</div>
    </div>
  </div>

  <!-- Autofill Credentials -->
  <div class="card" style="padding: 8px 12px;">
    <div class="field-row">
      <span class="field-label">Student</span>
      <span class="field-value" id="studentName">Tanmay Shahi</span>
    </div>
    <div class="field-row">
      <span class="field-label">College</span>
      <span class="field-value">MSOT</span>
    </div>
    <div class="field-row">
      <span class="field-label">Resume</span>
      <span class="field-value" style="color: #2563eb;">resume_2026.pdf ✓</span>
    </div>
  </div>

  <!-- Tailored Pitch Note -->
  <div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #475569;">
      <span>Tailored Application Pitch</span>
      <span style="color: #7c3aed; font-size: 10px;">AI-Protected</span>
    </div>
    <textarea rows="3" class="pitch-textarea" id="pitchNote">I can commit 15 focused hours a week outside my morning lectures, bringing hands-on Figma and copywriting skills to your deliverables.</textarea>
  </div>

  <!-- Action Buttons -->
  <button class="btn-primary" id="btnAutofill">
    <span>⚡ 1-Click Autofill Form</span>
  </button>

  <button class="btn-secondary" id="btnSaveCrm">
    <span>Log to FlexHunter CRM (Applied)</span>
  </button>

  <div class="status-msg" id="statusMsg">Form filled & role logged to CRM!</div>

  <script src="popup.js"></script>
</body>
</html>
